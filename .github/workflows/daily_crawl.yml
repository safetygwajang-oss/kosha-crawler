name: Daily KOSHA Crawl & Cafe Upload

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21시 = KST 06시
  workflow_dispatch:
    inputs:
      upload_limit:
        description: "카페 업로드 최대 건수 (테스트는 3, 정상운영은 30)"
        required: false
        default: "3"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore DB + thumbnails from artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: kosha-data
          path: data/
          if_no_artifact_found: warn
        continue-on-error: true

      - name: DB 상태 진단 (실행 전)
        run: |
          echo "===== data/ 폴더 내용 ====="
          ls -lah data/ 2>/dev/null || echo "data/ 폴더 없음"
          echo ""
          echo "===== data/thumbnails/ 개수 ====="
          ls data/thumbnails/ 2>/dev/null | wc -l || echo "0"
          echo ""
          echo "===== DB 진단 ====="
          python scripts/diagnose_db.py || echo "진단 스킵"

      - name: Run crawler + cafe upload
        env:
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN:  ${{ secrets.NAVER_REFRESH_TOKEN }}
          NAVER_CAFE_CLUB_ID:   "31767633"
          NAVER_CAFE_MENU_ID:   "12"
          NAVER_UPLOAD_ENABLED: "true"
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/run_once.py

      - name: 카페 업로드 강제 실행 (pending 처리)
        env:
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN:  ${{ secrets.NAVER_REFRESH_TOKEN }}
          NAVER_CAFE_CLUB_ID:   "31767633"
          NAVER_CAFE_MENU_ID:   "12"
          NAVER_UPLOAD_ENABLED: "true"
          UPLOAD_LIMIT: ${{ github.event.inputs.upload_limit || '3' }}
        run: python scripts/upload_only.py

      - name: DB 상태 진단 (실행 후)
        if: always()
        run: |
          echo "===== data/ 폴더 내용 ====="
          ls -lah data/
          echo ""
          echo "===== data/thumbnails/ 개수 ====="
          ls data/thumbnails/ 2>/dev/null | wc -l || echo "0"
          echo ""
          echo "===== DB 진단 ====="
          python scripts/diagnose_db.py || true

      - name: Upload DB + thumbnails artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kosha-data
          path: |
            data/kosha.db
            data/thumbnails/
          retention-days: 90
          overwrite: true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
