name: Daily KOSHA Crawl & Cafe Upload

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21시 = KST 06시
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore DB from artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: kosha-db
          path: data/
        continue-on-error: true

      - name: 🔍 DB 상태 진단
        run: |
          echo "===== data/ 폴더 내용 ====="
          ls -lah data/ || echo "data/ 폴더 없음"
          echo ""
          echo "===== DB 진단 스크립트 ====="
          python scripts/diagnose_db.py || echo "진단 스크립트 없음 - 스킵"

      - name: Run crawler + cafe upload
        env:
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN:  ${{ secrets.NAVER_REFRESH_TOKEN }}
          NAVER_CAFE_CLUB_ID:   "31767633"
          NAVER_CAFE_MENU_ID:   "12"
          NAVER_UPLOAD_ENABLED: "true"
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/run_once.py

      - name: 🔍 실행 후 DB 상태
        if: always()
        run: |
          echo "===== 실행 후 DB 크기 ====="
          ls -lah data/
          python scripts/diagnose_db.py || true

      - name: Upload DB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kosha-db
          path: data/kosha.db
          retention-days: 90
          overwrite: true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
