name: Daily KOSHA Crawl

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21시 = KST 06시
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore DB from artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: kosha-db
          path: data/
        continue-on-error: true

      - name: Run crawler
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/run_once.py

      - name: Upload DB
        uses: actions/upload-artifact@v4
        with:
          name: kosha-db
          path: data/kosha.db
          retention-days: 90

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: kosha-data-${{ github.run_number }}
          path: data/
          retention-days: 30
